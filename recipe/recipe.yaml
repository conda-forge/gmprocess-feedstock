schema_version: 1

context:
  # esi-shakelib restriction
  python_min: "3.12"
  version: "2.8.0"

package:
  name: gmprocess
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gmprocess/gmprocess-${{ version }}.tar.gz
  sha256: 2fb2a1d645be77bd5b22197e770c6a003a37d1d70c0857a0022c333d90889b93

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - gmconvert = gmprocess.bin.gmconvert:main
      - gminfo = gmprocess.bin.gminfo:cli
      - gmrecords = gmprocess.bin.gmrecords:main
      - gmworkspace = gmprocess.bin.gmworkspace:main
      - gmprocess_config = gmprocess.bin.gmprocess_config:main
      - cwa_gather = gmprocess.bin.cwa_gather:cli
      - fix_inventory = gmprocess.bin.fix_inventory:main
      - fetch_orfeus = gmprocess.bin.fetch_orfeus:cli
      - get_cali_cloud = gmprocess.bin.get_cali_cloud:main
      - export_ff_sac = gmprocess.bin.export_ff_sac:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools <82
    - setuptools-scm >=3.4
    - numpy
    - pip
  run:
    - python >=${{ python_min }}
    - beautifulsoup4 >=4.11.0
    - boto3
    - configobj >=5.0.6
    - esi-core >=1.2.1
    - esi-shakelib >=1.2.1
    - esi-utils-colors >1.0
    - esi-utils-io >1.0
    - folium >=0.12
    - gmpacket >=0.1.6
    - h3-py
    - h5py >=3.11
    - lxml >=4.6.1
    - matplotlib-base >=3.1.0
    - numba >=0.58
    - numpy >=2.0,<2.4
    - obspy >=1.5.0
    - openpyxl >=3.1.0
    - openquake.engine >=3.18
    - pandas >=1.3.0
    - pint >0.24.3
    - ps2ff >=1.5.9
    - pyarrow
    - pyasdf >=0.7
    - pydantic >=2.0
    - rdflib >=6.3.2
    - requests >=2.29
    - ruamel.yaml >=0.17.16
    - schema >=0.7
    - scipy >=1.7
    - setuptools-scm >=6.3.2
    - statsmodels >=0.12.2
    - tqdm >4.67
    - usgs-strec >=2.3.11
    - xlrd >=2.0

tests:
  - python:
      imports:
        - gmprocess
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - gmconvert --help
      - gminfo --help
      - gmrecords --help
      - gmworkspace --help
      - gmprocess_config --help
      - cwa_gather --help
      - fix_inventory --help
      - fetch_orfeus --help
      - get_cali_cloud --help
      - export_ff_sac --help

about:
  summary: USGS Automated Ground Motion Processing Software
  license: SL
  license_file: LICENSE.md
  homepage: https://pypi.org/project/gmprocess/

extra:
  recipe-maintainers:
    - ocefpaf
    - mhearne-usgs
    - cbworden
    - emthompson-usgs
